<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Apple Music Settings</title>
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="User Token">
        <sdpi-textfield setting="userToken" global placeholder="Music-User-Token cookie"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Dev Token">
        <sdpi-textarea setting="developerToken" global rows="4" placeholder="Bearer JWT Token"></sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="Info">
        <p>Tokens are saved globally across all Apple Music dials and keys, or can be kept in config.local.json.</p>
    </sdpi-item>
</body>
</html>
