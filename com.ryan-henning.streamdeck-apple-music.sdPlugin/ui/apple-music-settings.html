<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Playlists for Apple Music</title>
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Library folder">
        <sdpi-textfield setting="libraryPath" global placeholder="Found automatically"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Info">
        <p>Needs the Apple Music app for Windows (Microsoft Store) to be running. No Apple account details are used.
        Leave the library folder empty unless playlist covers are missing; then point it at your
        "Apple Music Library.musiclibrary" folder.</p>
        <p>Not affiliated with or endorsed by Apple.</p>
    </sdpi-item>
</body>
</html>
