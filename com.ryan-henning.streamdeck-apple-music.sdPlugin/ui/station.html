<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Play Station</title>
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Station">
        <sdpi-select setting="station" default="personal">
            <option value="personal">My Station</option>
            <option value="discovery">Discovery Station</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Info">
        <p>Starts the station from the "Stations for You" shelf on the Apple Music Home page.
        Not affiliated with or endorsed by Apple.</p>
    </sdpi-item>
</body>
</html>
